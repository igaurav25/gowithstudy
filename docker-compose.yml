name: campusflow

services:
  # Next.js Full-Stack Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campusflow-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-campusflow_secure_password}@db:5432/${POSTGRES_DB:-campusflow}?schema=public
      - AUTH_SECRET=${AUTH_SECRET:-campusflow-super-secure-dev-session-key-32chars}
      - SESSION_COOKIE_NAME=${SESSION_COOKIE_NAME:-campusflow_session}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - campusflow-network

  # PostgreSQL 16 Relational Database
  db:
    image: postgres:16-alpine
    container_name: campusflow-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusflow_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-campusflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-campusflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - campusflow-network

  # Redis In-Memory Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: campusflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - campusflow-network

volumes:
  postgres_data:
    name: campusflow_postgres_data
  redis_data:
    name: campusflow_redis_data

networks:
  campusflow-network:
    name: campusflow-network
    driver: bridge
